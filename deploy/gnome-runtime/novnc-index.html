<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d12">
<title>Debian 13 · Remote Desktop</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/svg+xml" href="debian-swirl.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0d0d12;
    overscroll-behavior: none; touch-action: none;
    position: fixed; inset: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #0d0d12; }
  #screen canvas { display: block; }

  /* ---------- boot overlay (Debian-style) ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    background: #0d0d12;
    color: #e6e6ea; text-align: center; padding: 24px;
    transition: opacity .5s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #swirl { height: 76px; width: auto; filter: drop-shadow(0 6px 30px rgba(215,10,83,.38)); }
  #overlay h1 {
    font-size: 17px; margin: 14px 0 2px; font-weight: 600;
    letter-spacing: .4px; color: #f2f2f5;
  }
  #overlay .sub { font-size: 12px; opacity: .5; margin: 0 0 18px; }

  /* systemd-style console */
  #console {
    font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.75;
    width: min(560px, 92vw); text-align: left;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px; padding: 12px 16px;
    min-height: 118px;
  }
  #console div { opacity: .42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #console div:last-child { opacity: 1; }
  #console .ok   { color: #7ee787; }
  #console .attn { color: #e3b341; }
  #console .fail { color: #ff7b72; }
  #console .plain{ color: #cfd2d8; }
  .cursor {
    display: inline-block; width: .55em; height: 1.05em;
    background: #e6e6ea; vertical-align: text-bottom; margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* stage progress (rebuild mode only) */
  #progress {
    width: min(560px, 92vw); height: 3px; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
    opacity: 0; transition: opacity .4s;
  }
  #progress.on { opacity: 1; }
  #progress i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #d70a53, #ff5c8a);
    transition: width 1.2s ease;
  }

  /* ---------- floating control pill ---------- */
  #bar {
    position: fixed; z-index: 40;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    display: flex; gap: 6px;
    transition: opacity .3s;
  }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar button {
    width: 44px; height: 44px; border-radius: 13px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(18,18,24,.72);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; padding: 0;
  }
  #bar button:active { background: rgba(215,10,83,.6); }
  #bar svg { width: 20px; height: 20px; fill: #fff; pointer-events: none; }

  /* ---------- status pill ---------- */
  #status {
    position: fixed; z-index: 40;
    top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%;
    transform: translateX(-50%);
    background: rgba(18,18,24,.78); color: #eee;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12);
    padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 550; letter-spacing: .2px;
    opacity: 0; transition: opacity .35s; pointer-events: none;
    white-space: nowrap; max-width: 86vw; overflow: hidden; text-overflow: ellipsis;
  }
  #status.show { opacity: 1; }
  #status .ok { color: #8ff0a4; }
  #status .err { color: #ff9c9c; }
</style>
</head>
<body>
  <div id="screen"></div>

  <div id="bar" class="hidden">
    <button id="btn-fs" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm16 0v6h-2V6h-4V4h6zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
    </button>
    <button id="btn-kb" title="Keyboard" aria-label="Keyboard">
      <svg viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
    </button>
    <button id="btn-rld" title="Reconnect" aria-label="Reconnect">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="status"></div>

  <div id="overlay">
    <img id="swirl" src="debian-swirl.svg" alt="Debian">
    <h1>Debian GNU/Linux 13</h1>
    <p class="sub">trixie · GNOME 48 · remote session</p>
    <div id="console"></div>
    <div id="progress"><i id="prog-fill"></i></div>
  </div>

<script type="module">
const VNC_PASSWORD = 'trf7-wgrL-Xv1I-LyBH';

const $ = id => document.getElementById(id);
const screen = $('screen');
const overlay = $('overlay');
const consoleEl = $('console');
const progress = $('progress');
const progFill = $('prog-fill');
const bar = $('bar');
const statusEl = $('status');

let RFB = null;
let rfb = null;
let connected = false;
let retries = 0;
let statusTimer = null;
let wakeLock = null;
let probing = false;
let lastNote = '';

/* ---------- systemd-style console ---------- */
const MAXLINES = 6;
function line(text, cls, cursor) {
  const div = document.createElement('div');
  div.className = cls || 'plain';
  div.textContent = text;
  if (cursor) {
    const c = document.createElement('span');
    c.className = 'cursor';
    div.appendChild(c);
  }
  consoleEl.appendChild(div);
  while (consoleEl.children.length > MAXLINES) consoleEl.removeChild(consoleEl.firstChild);
}

/* ---------- status pill (connected mode) ---------- */
function showStatus(html) {
  statusEl.innerHTML = html;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.remove('show'), 4000);
}

function updateOverlayState() {
  if (connected) {
    overlay.classList.add('hidden');
    bar.classList.remove('hidden');
  } else {
    overlay.classList.remove('hidden');
  }
}

function wsURL() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + '/websockify';
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* not critical */ }
}

/* =====================================================================
   Boot state machine
   ---------------------------------------------------------------------
   probe()  - is a rebuild running? (status.json served by the bootstrap
              placeholder). 404 -> normal connect. stage notes -> rebuild.
   startApp()- dynamic-import noVNC, connect to the live desktop.
   ===================================================================== */
const STAGE_PCT = { boot: 4, download: 12, extract: 42, setup: 72, data: 88, start: 96, ready: 100 };

async function probe() {
  if (probing) return;
  probing = true;
  let netErrs = 0;
  line('Debian GNU/Linux 13 (trixie) — web console', 'plain', true);
  while (true) {
    let st = null;
    try {
      const r = await fetch('status.json', { cache: 'no-store' });
      if (r.status === 404) break;                 // real stack -> connect
      if (r.ok) st = await r.json();
    } catch (e) { netErrs++; }
    if (!st) {
      if (netErrs > 10) break;                     // placeholder gone -> connect
      await new Promise(r => setTimeout(r, 1500));
      continue;
    }
    if (st.stage === 'ready') break;               // boot complete -> connect
    /* rebuild in progress: show the real bootstrap stage note (deduped) */
    progress.classList.add('on');
    progFill.style.width = (STAGE_PCT[st.stage] || 50) + '%';
    const note = '[ .. ] ' + (st.note || st.stage);
    if (note !== lastNote) { lastNote = note; line(note, st.cls || 'plain', true); }
    await new Promise(r => setTimeout(r, 2000));
  }
  probing = false;
  startApp();
}

async function startApp() {
  if (!RFB) {
    try {
      const mod = await import('./core/rfb.js');
      RFB = mod.default;
    } catch (e) {
      /* rfb.js not served yet (server switching) - retry shortly */
      setTimeout(startApp, 2000);
      return;
    }
  }
  line('[ OK ] Starting VNC tunnel…', 'ok', true);
  connect();
}

function connect() {
  try { rfb && rfb.disconnect(); } catch (e) {}
  connected = false;
  updateOverlayState();

  rfb = new RFB(screen, wsURL(), {
    credentials: { password: VNC_PASSWORD },
    shared: true,
  });

  /* THE perfect-fit combo:
     - resizeSession: the Debian desktop resolution FOLLOWS this window 1:1
       (phones, tablets, any browser size) through RFB SetDesktopSize
     - scaleViewport: if the server can't resize, scale to fit instead -
       either way there are NEVER scrollbars */
  rfb.scaleViewport = true;
  rfb.resizeSession = true;
  rfb.background = '#0d0d12';
  rfb.showLocalCursor = true;

  rfb.addEventListener('connect', () => {
    connected = true;
    retries = 0;
    line('[ OK ] Display server :1 — authenticated', 'ok');
    /* fade as soon as the first real frame is painted */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      line('[ OK ] GNOME 48 — graphical interface reached', 'ok');
      updateOverlayState();
      showStatus('<span class="ok">● connected</span> · ' +
        rfb._fbWidth + '×' + rfb._fbHeight, true);
    }));
    requestWakeLock();
  });

  rfb.addEventListener('disconnect', e => {
    connected = false;
    updateOverlayState();
    if (e.detail && e.detail.clean) {
      showStatus('<span class="err">disconnected</span>', false);
    }
    /* auto-reconnect with gentle backoff - never leaves the user stranded;
       every 3rd failure, re-probe in case a rebuild kicked in */
    const delay = Math.min(1500 * Math.pow(1.6, retries++), 10000);
    line('[ATTN] link lost — retry ' + retries + ' in ' + Math.round(delay / 1000) + 's', 'attn', true);
    if (retries % 3 === 0) { probe(); return; }
    setTimeout(connect, delay);
  });

  rfb.addEventListener('securityfailure', () => {
    line('[FAILED] authentication — VNC password changed', 'fail');
    showStatus('<span class="err">auth failed — reload the page</span>', false);
  });
}

/* ---------- controls ---------- */
$('btn-fs').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      if (screen.orientation && screen.orientation.lock)
        screen.orientation.lock('landscape').catch(() => {});
    } else {
      await document.exitFullscreen();
    }
  } catch (e) { /* iOS Safari etc */ }
});

$('btn-kb').addEventListener('click', () => {
  try { rfb && rfb.focus({ preventScroll: true }); } catch (e) {}
  showStatus('keyboard focused - tap the screen to type');
});

$('btn-rld').addEventListener('click', () => {
  retries = 0;
  consoleEl.textContent = '';
  probe();
});

/* keep the bar visible while touching, fade while working */
let barTimer = null;
function pokeBar() {
  bar.classList.remove('hidden');
  clearTimeout(barTimer);
  barTimer = setTimeout(() => { if (connected) bar.classList.add('hidden'); }, 3500);
}
window.addEventListener('pointerdown', pokeBar, { passive: true });
window.addEventListener('pointermove', pokeBar, { passive: true });
setTimeout(() => { if (connected) bar.classList.add('hidden'); }, 6000);

/* reconnect when the tab becomes visible again */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if (!connected) { retries = 0; connect(); }
  }
});

/* stop mobile browsers from hijacking gestures */
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* start */
probe();
</script>
</body>
</html>
